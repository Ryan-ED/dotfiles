# ~/.config/hypr/hyprland.conf
#
# Minimal, distro/DE-agnostic Hyprland starter config. Meant to run
# *alongside* whatever desktop environment (or none) is already installed —
# just pick the "Hyprland" entry at your display/login manager. Nothing
# here assumes a specific distro, DE, or login manager, and nothing here
# touches any other session's config.
#
# Full reference: https://wiki.hyprland.org/Configuring/

#################
### MONITORS ####
#################

monitor = , preferred, auto, auto

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Generic Wayland-first hints for GTK/Qt apps. Safe on any distro/DE: both
# toolkits fall back to X11 on their own if a given app can't do Wayland.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11

###################
### MY PROGRAMS ###
###################

$terminal = wezterm
$fileManager = nautilus
$menu = wofi --show drun
$mainMod = SUPER

#################
### AUTOSTART ###
#################

# Status bar + notifications + idle/lock daemon.
exec-once = waybar
exec-once = mako
exec-once = hypridle

# A polkit authentication agent is required for graphical sudo prompts
# (package installs, mounting drives, etc.) but which one you have depends
# on what's already installed alongside Hyprland (KDE, GNOME, LXQt, or a
# standalone one like polkit-gnome). Pick one and uncomment/adjust its path
# below rather than hardcoding a guess that may not exist on your system:
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = /usr/libexec/polkit-kde-authentication-agent-1
# exec-once = /usr/lib/x86_64-linux-gnu/libexec/lxqt-policykit-agent

# Lets XDG portals (screen share, file pickers) see the Wayland session
# variables. Standard dbus tooling, present on any systemd distro.
exec-once = dbus-update-activation-environment --systemd --all

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = windows, 1, 3, easeOutQuint, popin 85%
    animation = windowsOut, 1, 3, linear, popin 85%
    animation = border, 1, 5, easeOutQuint
    animation = fade, 1, 3, linear
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

###################
### KEYBINDINGS ###
###################

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod SHIFT, L, exec, hyprlock

# Focus movement (vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Restart waybar without restarting the whole session
bind = $mainMod SHIFT, B, exec, killall -SIGUSR2 waybar

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (needs grim + slurp)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy

# Media / brightness keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Example: float small utility dialogs instead of tiling them. Add rules
# for your own polkit agent / file manager / settings app here as needed —
# see https://wiki.hyprland.org/Configuring/Window-Rules/
# windowrulev2 = float, title:^(Authenticate)$
